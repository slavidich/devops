apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Cluster infrastructure
  sourceRepos:
    - https://github.com/slavidich/devops.git
    - https://prometheus-community.github.io/helm-charts # prometheus grafana stack 
    - https://codecentric.github.io/helm-charts # keycloak
  destinations:
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: postgres
      server: https://kubernetes.default.svc
    - namespace: keycloak
      server: https://kubernetes.default.svc
    - namespace: redis
      server: https://kubernetes.default.svc
    - namespace: minio
      server: https://kubernetes.default.svc
    # kube-prometheus-stack scrapes CoreDNS via a Service in kube-system
    - namespace: kube-system
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

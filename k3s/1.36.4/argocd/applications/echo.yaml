apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: echo
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/slavidich/devops.git
    targetRevision: main
    path: k3s/1.36.4/apps/echo

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
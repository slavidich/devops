apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: whoami
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ТВОЙ_USERNAME/ТВОЙ_REPOSITORY.git
    targetRevision: main
    path: k3s/1.36.4/apps/whoami

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true